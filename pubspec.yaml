
name: college_notice_board
description: "College Notice Board Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  url_launcher: ^6.3.3
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  file_picker: ^13.3.3
  firebase_core: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
